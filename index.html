<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d18">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hoyul Music">
  <meta name="description" content="아이폰 파일 앱의 음악을 기기에 저장해 오프라인으로 재생하는 개인 음악 플레이어">
  <meta name="app-version" content="2.3.0">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./hoyul-music-icon-user-v3.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <title>Hoyul Music</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="addBtn" class="top-circle" type="button" aria-label="파일 추가">＋</button>
      <div class="top-caption" aria-hidden="true"></div>
      <button id="manageBtn" class="top-circle more" type="button" aria-label="관리">•••</button>
    </header>

    <main>
      <section class="now-card" aria-label="현재 재생">
        <div class="hero-blur" aria-hidden="true"></div>
        <div class="hero-art" aria-hidden="true">
          <img id="heroArtworkImage" src="./hoyul-music-icon-512-v2.png" alt="">
        </div>
        <div class="hero-shade" aria-hidden="true"></div>
        <div class="now-content">
        <div class="now-meta">
          <h2 id="nowTitle">음악 없음</h2>
          <p id="nowArtist" class="artist">재생할 음악을 선택하세요</p>
        </div>

        <div class="timeline">
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치" disabled>
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="transport">
          <button id="shuffleBtn" class="mode-btn" type="button" aria-pressed="false" aria-label="셔플">
            <svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 6.5h2.3c2.5 0 3.8 1.2 5.3 3.3l2 2.8c1.4 2 2.7 3.1 5.3 3.1H21"/>
              <path d="m17.8 12.5 3.2 3.2-3.2 3.2"/>
              <path d="M3.5 17.5h2.3c2.3 0 3.6-1 5-2.8"/>
              <path d="M13.5 8.8c1.3-1.5 2.6-2.3 4.9-2.3H21"/>
              <path d="m17.8 3.3 3.2 3.2-3.2 3.2"/>
            </svg>
          </button>
          <button id="prevBtn" class="transport-btn" type="button" aria-label="이전 곡">◀︎◀︎</button>
          <button id="playBtn" class="play-btn" type="button" aria-label="재생" disabled>▶</button>
          <button id="nextBtn" class="transport-btn" type="button" aria-label="다음 곡">▶︎▶︎</button>
          <button id="repeatBtn" class="mode-btn" type="button" aria-label="반복">
            <svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V7.8A3.8 3.8 0 0 1 7.8 4h10.7"/>
              <path d="m16 1.5 2.5 2.5L16 6.5"/>
              <path d="M20 15v1.2a3.8 3.8 0 0 1-3.8 3.8H5.5"/>
              <path d="M8 22.5 5.5 20 8 17.5"/>
            </svg>
            <span class="repeat-one-badge" aria-hidden="true">1</span>
          </button>
        </div>

        <p id="playbackStatus" class="status">음악을 추가하면 이 기기에 오프라인 저장됩니다.</p>
        </div>
      </section>

      <section class="library">
        <div class="section-head">
          <div>
            <h2 id="libraryTitle">보관함</h2>
            <p id="librarySubtitle" class="library-subtitle">전체 음악</p>
          </div>
          <span id="trackCount" class="count">0곡</span>
        </div>

        <div class="library-actions">
          <button id="libraryFileAddBtn" class="library-action" type="button">파일 추가</button>
          <button id="playlistAddBtn" class="library-action primary-action" type="button">플레이리스트 +</button>
          <button id="playlistEditBtn" class="library-action" type="button" hidden>편집</button>
        </div>

        <div id="playlistTabs" class="playlist-tabs" aria-label="플레이리스트 선택"></div>

        <div id="emptyState" class="empty">
          <strong id="emptyTitle">아직 음악이 없습니다.</strong>
          <span id="emptyText">아이폰 파일 앱에서 음악 파일을 가져오세요.</span>
          <button id="emptyAddBtn" class="primary" type="button">파일 추가</button>
        </div>
        <div id="trackList" class="track-list"></div>
      </section>
    </main>
  </div>

  <dialog id="manageDialog">
    <div class="dialog-head">
      <h2>관리</h2>
      <button id="closeManageBtn" class="ghost" type="button">닫기</button>
    </div>
    <div class="dialog-body">
      <h3>저장 공간</h3>
      <p id="storageInfo" class="muted">확인 중…</p>
      <button id="persistBtn" class="wide" type="button">저장 공간 보호 요청</button>
      <p id="persistInfo" class="muted"></p>

      <h3>백그라운드 재생 테스트</h3>
      <p class="muted">음악을 직접 재생한 뒤 홈으로 나가거나 화면을 잠가 보세요. iOS가 웹앱 프로세스를 종료하면 재생이 끊길 수 있습니다.</p>

      <h3>음악 전체 삭제</h3>
      <button id="clearBtn" class="danger wide" type="button">저장된 음악 모두 삭제</button>

      <p class="version">버전 2.3.0</p>
    </div>
  </dialog>

  <dialog id="playlistDialog" aria-labelledby="playlistDialogTitle">
    <div class="dialog-head">
      <h2 id="playlistDialogTitle">새 플레이리스트</h2>
      <button id="closePlaylistBtn" class="ghost" type="button">닫기</button>
    </div>
    <div class="dialog-body playlist-dialog-body">
      <label class="field-label" for="playlistName">플레이리스트 이름</label>
      <input id="playlistName" class="text-input" maxlength="80" placeholder="예: 자주 듣는 곡" autocomplete="off">

      <div class="playlist-pick-head">
        <p id="playlistPickSummary" class="muted">0곡 선택</p>
        <div class="playlist-pick-actions">
          <button id="selectAllPlaylistBtn" class="mini-action" type="button">전체 선택</button>
          <button id="clearPlaylistSelectionBtn" class="mini-action" type="button">선택 해제</button>
        </div>
      </div>

      <div id="playlistTrackChoices" class="playlist-track-choices"></div>

      <div class="playlist-dialog-actions">
        <button id="deletePlaylistBtn" class="danger" type="button" hidden>플레이리스트 삭제</button>
        <span class="dialog-spacer"></span>
        <button id="cancelPlaylistBtn" class="ghost" type="button">취소</button>
        <button id="savePlaylistBtn" class="primary" type="button">저장</button>
      </div>
    </div>
  </dialog>

  <dialog id="trackActionDialog"><div class="dialog-head"><h2 id="trackActionTitle">음악</h2><button id="closeTrackActionBtn" class="ghost" type="button">닫기</button></div><div class="dialog-body action-sheet"><button id="changeCoverBtn" class="sheet-action" type="button">커버 변경</button><button id="addTrackToPlaylistBtn" class="sheet-action" type="button">플레이리스트에 추가</button><button id="removeOrDeleteTrackBtn" class="sheet-action danger" type="button">삭제</button></div></dialog>
  <dialog id="coverDialog"><div class="dialog-head"><h2 id="coverDialogTitle">커버 변경</h2><button id="closeCoverBtn" class="ghost" type="button">닫기</button></div><div class="dialog-body"><p id="coverTrackName" class="cover-track-name"></p><div class="cover-actions"><button id="searchCoverBtn" class="sheet-action" type="button">온라인에서 검색</button><button id="chooseCoverPhotoBtn" class="sheet-action" type="button">사진 / 이미지 선택</button><button id="chooseCoverFileBtn" class="sheet-action" type="button">파일에서 선택</button><button id="restoreCoverBtn" class="sheet-action" type="button">원본 커버로 복원</button><button id="removeCoverBtn" class="sheet-action danger" type="button">커버 제거</button></div><div id="coverSearchArea" class="cover-search-area" hidden><div class="cover-search-row"><input id="coverSearchQuery" class="text-input" type="search" placeholder="아티스트 + 곡명"><button id="runCoverSearchBtn" class="primary" type="button">검색</button></div><p id="coverSearchStatus" class="muted"></p><div id="coverSearchResults" class="cover-results"></div></div></div></dialog>
  <dialog id="addToPlaylistDialog"><div class="dialog-head"><h2>플레이리스트에 추가</h2><button id="closeAddToPlaylistBtn" class="ghost" type="button">닫기</button></div><div class="dialog-body"><div id="addToPlaylistChoices" class="playlist-targets"></div></div></dialog>
  <input id="coverPhotoInput" type="file" accept="image/*" hidden>
  <input id="coverFileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.heic,.heif" hidden>
  <input id="fileInput" type="file" accept=".mp3,.m4a,.aac,.wav,.flac,.ogg" multiple hidden>
  <audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
